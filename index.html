    <script>
      // Gracefully prevent unhandled rejection overlays for benign Vite WebSocket connection attempts in container preview
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        var msg = typeof reason === 'string' ? reason : (reason && (reason.message || reason.stack)) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('closed without opened') !== -1) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('closed without opened') !== -1) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="h-full bg-[#050505] text-[#e5e7eb] font-sans selection:bg-blue-600 selection:text-white">

  </body>
